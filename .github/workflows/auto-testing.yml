name: "Auto Testing for sveltekit"

on:
  push:
    branches-ignore:
      - "develop"
    paths:
      - ".github/workflows/auto-testing.yml"
      - "src/**"

permissions:
  id-token: write # OIDC を利用する際に必須
  contents: read # actions/cgheckout のために必要

env:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: password
  POSTGRES_HOST: localhost
  POSTGRES_PORT: 5432
  POSTGRES_PRISMA_URL: postgres://postgres:password@localhost:5432/testdb?schema=public
  POSTGRES_URL_NON_POOLING: postgres://postgres:password@localhost:5432/testdb?schema=public

jobs:
  auto-testing:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    services:
      postgres:
        # Docker Hubのイメージ
        image: postgres
        # postgresのパスワードを提供
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        # postgresが起動するまで待つヘルスチェックの設定
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis
        ports:
          - 6379:6379

    # yarn network cache の保存先を指定しておく
    # https://blog.lacolaco.net/2021/06/github-actions-yarn-cache/
    env:
      NODE_OPTIONS: --max_old_space_size=4096

    steps:
      # https://github.com/marketplace/actions/setup-elasticsearch
      # swapoff なんてしていいのかなぁ...
      - name: Configure sysctl limits
        run: |
          sudo swapoff -a
          sudo sysctl -w vm.swappiness=1
          sudo sysctl -w fs.file-max=262144
          sudo sysctl -w vm.max_map_count=262144

      - uses: actions/checkout@v4
      - run: corepack enable pnpm

      - name: Setup Node.js for use with actions
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: latest

      - name: echo information
        run: |
          echo "node version $(node -v) running"
          echo "corepack version $(corepack -v) running"
          echo "pnpm version $(pnpm -v) running"

      # pnpm のキャッシュディレクトリを取得
      - id: pnpm
        run: echo "cache-dir=$(pnpm store path)" >> $GITHUB_OUTPUT
      # キャッシュをリストア
      - uses: actions/cache@v3
        with:
          path: ${{ steps.pnpm.outputs.cache-dir }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: install node_modules with pnpm
        run: |
          pnpm install --frozen-lockfile
        timeout-minutes: 3

      - name: typescript type check
        run: |
          pnpm tsc
        timeout-minutes: 3

      - name: lint&format with Biome
        run: pnpm biome ci ./src
        timeout-minutes: 3

      - name: test with vitest
        run: |
          pnpm test:ci:coverage
        timeout-minutes: 3

